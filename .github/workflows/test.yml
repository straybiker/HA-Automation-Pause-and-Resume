name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Home Assistant ships monthly. Check weekly even when nothing is committed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The newest release, and the oldest that hacs.json allows.
        include:
          - home-assistant: newest
            requirements: requirements-dev.txt
          - home-assistant: oldest
            requirements: requirements-dev-oldest.txt
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.3 and later need Python 3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}

      - name: Run tests
        run: pytest -q --junitxml=junit.xml

      # Strict typing needs Home Assistant's type hints, so it runs here. The
      # files and flags are in pyproject.toml.
      - name: Type check
        if: matrix.home-assistant == 'newest'
        run: mypy

      # scripts/report/collect.py --ci builds the test report from these files.
      - name: Record the Home Assistant and Python versions
        if: always()
        run: >-
          python -c "import sys; from homeassistant.const import __version__ as v;
          print(v, sys.version.split()[0])" > versions.txt

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.home-assistant }}
          path: |
            junit.xml
            versions.txt

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Lint
        run: |
          # Same version as requirements-dev.txt, so format checks match local runs.
          pip install ruff==0.16.10
          ruff check .
          ruff format --check .

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend-src/.nvmrc
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: >-
          npm test -- --reporter=default --reporter=junit
          --outputFile.junit=${{ runner.temp }}/vitest.xml

      - name: Build
        run: npm run build

      # HACS installs the committed bundle, so it must match the source.
      - name: Check the committed bundle is current
        run: |
          git diff --exit-code -- ../custom_components/automation_pause/frontend/
          test -z "$(git status --porcelain -- ../custom_components/automation_pause/frontend/)"

      # scripts/report/collect.py --ci builds the test report from this file.
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-frontend
          path: ${{ runner.temp }}/vitest.xml
