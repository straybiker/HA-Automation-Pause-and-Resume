name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Home Assistant ships monthly. Check weekly even when nothing is committed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.3 and later need Python 3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Lint
        run: |
          # Same version as requirements-dev.txt, so format checks match local runs.
          pip install ruff==0.16.10
          ruff check .
          ruff format --check .

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend-src/.nvmrc
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # HACS installs the committed bundle, so it must match the source.
      - name: Check the committed bundle is current
        run: |
          git diff --exit-code -- ../custom_components/automation_pause/frontend/
          test -z "$(git status --porcelain -- ../custom_components/automation_pause/frontend/)"
