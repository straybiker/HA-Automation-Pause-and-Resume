[project]
name = "ha-automation-pause-and-resume"
version = "0.1.0-beta.1"
description = "Home Assistant custom integration to pause an automation for a set time"
readme = "README.md"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# custom_components is not an installed package, so put the repo root on
# sys.path. Without this only "python -m pytest" works.
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
