[project]
name = "ha-automation-pause-and-resume"
version = "0.1.0-beta.1"
description = "Home Assistant custom integration to pause an automation for a set time"
readme = "README.md"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# custom_components is not an installed package, so put the repo root on
# sys.path. Without this only "python -m pytest" works.
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Strict typing, as Home Assistant core checks its strict integrations
# (core's mypy.ini). Only the integration: the tests use the harness's
# untyped fixtures.
[tool.mypy]
python_version = "3.14"
files = ["custom_components/automation_pause"]
strict = true
local_partial_types = true
strict_equality = true
warn_unreachable = true
disallow_any_generics = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]

[[tool.mypy.overrides]]
# Home Assistant re-exports some names without "as", for example
# StaticPathConfig in homeassistant.components.http.
module = "homeassistant.*"
implicit_reexport = true
